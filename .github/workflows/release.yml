# Pushing a tag that equals manifest.json's version (no "v" prefix) builds the
# plugin and opens a DRAFT GitHub release with main.js, manifest.json and
# styles.css attached.
# Review the draft, then publish it; Obsidian's directory picks releases up
# from GitHub. Only works when this folder is the root of its own repository.
name: Release Obsidian plugin
on:
  push:
    tags:
      - "*"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Check the tag is the manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag isn't the version in manifest.json ($version)."
            exit 1
          fi
      - name: Build plugin
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The release's description is RELEASE_NOTES.md: write it for each version before tagging.
          gh release create "$tag" \
            --title="$tag" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            main.js manifest.json styles.css
